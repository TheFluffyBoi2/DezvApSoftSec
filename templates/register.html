{% extends "base.html" %} {% block content %}
<h2>Register</h2>
<form method="post">
  <label for="email">Email</label><br />
  <input
    type="email"
    id="email"
    required
    placeholder="nume@email.com"
    name="email"
  /><br /><br />
  <label>Password</label><br />
  <input name="password" type="password" /><br /><br />
  <button type="submit">Create account</button>
</form>
{% endblock %}
